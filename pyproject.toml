[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "btrack>=0.7.0",
    "cellpose[gui]>=4.2.1.1",
    "deepcell-tracking>=0.6.3",
    "matplotlib<3.9.0",
    "napari[all]>=0.9.0",
    "stardist>=0.9.2",
    "traccuracy>=0.4.3",
    "trackastra>=0.5.5",
    "torch",
    "torchvision"
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "methods"]
